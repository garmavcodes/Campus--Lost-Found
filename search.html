<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Items</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <h2>Campus Lost & Found</h2>
    </nav>

    <header>
        <h1>Search Items</h1>
        <p>Looking for something? Let's help you find it!</p>
    </header>

    <form id="searchForm">

        <label for="searchName">Item Name:</label>
        <input type="text" id="searchName" placeholder="Enter item name">

        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate">

        <label for="endDate">End Date:</label>
        <input type="date" id="endDate">

        <button type="submit">Search</button>

    </form>

    <section class="items-section">
        <h2>Search Results</h2>
        <div id="searchResults" class="items-grid"></div>
    </section>

    <script src="script.js"></script>

</body>
</html>
